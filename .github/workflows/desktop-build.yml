name: Build desktop

on:
  push:
    paths:
      - "tabletizer-desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "tabletizer-desktop/**"
      - ".github/workflows/desktop-build.yml"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tabletizer-linux
            output: dist/tabletizer
          - os: macos-latest
            artifact: tabletizer-macos
            output: dist/tabletizer
          - os: windows-latest
            artifact: tabletizer-windows
            output: dist/tabletizer.exe

    defaults:
      run:
        working-directory: tabletizer-desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name tabletizer --icon logo_final.ico --add-data "web;web" main.py

      - name: Build on macOS and Linux
        if: runner.os != 'Windows'
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name tabletizer --add-data "web:web" main.py

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tabletizer-desktop/${{ matrix.output }}
          if-no-files-found: error

      - name: Attach build to GitHub release
        if: github.event_name == 'release'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "tabletizer-desktop/${{ matrix.output }}#${{ matrix.artifact }}"
